# ============================================================
# Tutorial scenario: a two-building district cooling network
# ============================================================
# A deliberately small scenario for a first run. It carries only
# what this network needs; everything else falls back to the
# package defaults in discoolpy.utils.DESIGN_DEFAULTS. The other
# files in this directory show the sections left out here:
# storage, pipe heat gains, building envelopes, satellite plants,
# tariffs and branching topologies.
#
# Run it with:
#   from discoolpy import check_scenario, run_scenario
#   check_scenario("../configs/config_tutorial.yaml")
#   result = run_scenario("../configs/config_tutorial.yaml")
# ============================================================

metadata:
  name: tutorial
  description: Two-building district cooling network with dummy data

# Design point. The solve at these conditions sizes the heat
# exchangers, the pump and the condenser-water flow; every later
# snapshot is an offdesign solve against that sizing.
design:
  supply_temperature_degC: 7.0              # chilled water leaving the plant
  building_return_temperature_degC: 12.0    # chilled water coming back
  condenser_inlet_temperature_degC: 32.0    # cooling water entering the chiller
  condenser_outlet_temperature_degC: 38.0   # cooling water leaving the chiller
  pump_power_W: 500.0                       # distribution pump at design flow

# Demand. `archetype` picks the daily occupancy shape the profile
# generator uses: office, hotel, retail, residential, hospital or
# datacentre.
buildings:
  - label: office
    Q_design_W: 150000.0
    archetype: office
    pr: 0.995        # pressure ratio across the building heat exchanger
  - label: hotel
    Q_design_W: 120000.0
    archetype: hotel
    pr: null         # last building: left free, the bypass closes the loop

chiller:
  label: tutorial_chiller
  T_evap_degC: 2.0           # design evaporating temperature
  T_cond_degC: 44.0          # design condensing temperature
  eta_s: 0.75                # design isentropic efficiency
  refrigerant: R134a
  native_offdesign:
    enabled: true            # size kA at design, reuse it offdesign

cooling_tower:
  label: tutorial_cooling_tower
  # The design solve sizes the condenser-water flow from the two
  # design temperatures. `design_flow` keeps that flow for every
  # offdesign solve and lets the leaving temperature move, which is
  # how a condenser-water loop runs: the pump holds its duty and the
  # water comes back as warm as the weather makes it.
  condenser_flow_control: design_flow
  # Fallback only, for snapshots that carry no condenser-water
  # temperature of their own. The generated profile always does.
  approach_temperature_K: 4.0

# Distribution. `pressure_ratio` is the simplest pipe model: each
# pipe is given a pressure ratio directly. Q: 0.0 makes a pipe
# adiabatic. See config_riyadh_heat_gains.yaml for pipes with real
# geometry and heat gain.
branch:
  label: tutorial_branch
  pump_label: main pump
  pipe_model: pressure_ratio
  pipes:
    supply_1:
      Q: 0.0
    supply_2:
      pr: 0.997      # links the main pressure island to the end of the line
      Q: 0.0
    return_2:
      Q: 0.0
    return_1:
      pr: 0.999      # anchors the return-header pressure

# Four hourly days of synthetic weather and demand: a typical
# summer day, a heat wave, a milder day, then the first day again.
profiles:
  start: "2026-07-01 00:00:00"
  periods: 96
  freq: 1h
  daily_high_degC: [43.0, 46.0, 38.0, 43.0]
  daily_low_degC: [28.0, 29.0, 27.0, 28.0]

solver:
  max_iter: 250
  iterinfo: false

outputs:
  output_dir: tutorial_outputs
